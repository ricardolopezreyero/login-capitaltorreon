<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Entrar · CapitalTorreon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23fff' font-family='system-ui' font-weight='800'%3ECT%3C/text%3E%3C/svg%3E">
<style>
/* RLR · Ricardo López Reyero */
:root{--bg:#0f0f10;--caja:#17181a;--borde:#2a2c30;--tx:#f4f4f5;--su:#9a9ca3;--ac:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.caja{width:min(420px,100%);background:var(--caja);border:1px solid var(--borde);border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 20px 60px #0008}
h1{margin:0 0 4px;font-size:1.35em;letter-spacing:-.01em}
.marca{display:inline-flex;align-items:center;gap:8px;font-weight:800;margin-bottom:18px}
.marca i{width:30px;height:30px;border-radius:8px;background:#fff;color:#111;font-style:normal;font-size:.8em;display:grid;place-items:center}
p{margin:0 0 18px;color:var(--su)}
p b{color:var(--tx)}
#g{min-height:44px;display:flex;justify-content:center;align-items:center;color-scheme:light}
.nota{font-size:.8em;margin-top:18px}
.nota a{color:var(--su)}
#estado{min-height:1.4em;margin-top:10px;font-size:.92em}
</style>
</head>
<body>
<main><div class="caja">
  <div class="marca"><i>CT</i>CapitalTorreon</div>
  <h1>Entrar</h1>
  <p id="para">Con tu cuenta de Google, una sola vez para todos los servicios.</p>
  <div id="g"></div>
  <div id="estado"></div>
  <p class="nota">Solo guardamos tu correo, tu nombre y tu foto de Google. Nada más.</p>
</div></main>
<script>
// La página recibe ?volver=<liga del servicio>. Al entrar, regresa ahí con #sesion=<pase>.
const volver = new URLSearchParams(location.search).get('volver') || '', estado = document.getElementById('estado');
try { const u = new URL(volver); document.getElementById('para').innerHTML = 'Vas a entrar a <b>' + u.hostname.replace(/[<>&]/g, '') + '</b> con tu cuenta de Google.'; } catch {}
async function alEntrar(r) {
  estado.textContent = 'Entrando…';
  try {
    const x = await fetch('/api/entrar', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ credential: r.credential, volver: volver || location.origin + '/?sesion' }) }), d = await x.json();
    if (!x.ok) throw d.error;
    if (!volver) { estado.textContent = 'Listo. Ya tienes sesión; abre el servicio al que querías entrar.'; return; }
    estado.textContent = 'Listo, volviendo…'; location.replace(d.volver);
  } catch (e) { estado.textContent = e === 'volver' ? 'Esa liga de regreso no es de la casa.' : 'Google no aceptó la entrada. Inténtalo otra vez.'; }
}
(async () => {
  const { id } = await (await fetch('/api/cliente')).json();
  // Si ya entró en otro servicio, se le ofrece seguir con esa cuenta sin pasar por Google otra vez.
  if (volver && new URLSearchParams(location.search).has('elegir')) { try { const q = await (await fetch('/api/quien')).json(); if (q.email) { const d = document.createElement('p'); d.innerHTML = 'Ya estás dentro como <b>' + q.email.replace(/[<>&]/g, '') + '</b>. <a href="/?volver=' + encodeURIComponent(volver) + '">Seguir con esa cuenta</a> o elige otra abajo.'; document.getElementById('g').before(d); } } catch {} }
  await new Promise((ok, mal) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
  google.accounts.id.initialize({ client_id: id, callback: alEntrar, auto_select: true, cancel_on_tap_outside: true, context: 'signin', ux_mode: 'popup', itp_support: true });
  google.accounts.id.renderButton(document.getElementById('g'), { type: 'standard', theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'pill', locale: 'es' });
  google.accounts.id.prompt();
})().catch(() => { estado.textContent = 'No se pudo abrir Google. Revisa tu conexión.'; });
</script>
<!-- RLR · Ricardo López Reyero -->
</body>
</html>
